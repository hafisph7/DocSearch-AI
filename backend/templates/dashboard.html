<!DOCTYPE html>
<html>
<head>
    <title>DocSearch AI Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: #f4f6f9;
        }

        /* ================= HEADER ================= */
        .header {
            background: linear-gradient(135deg, #ff4b2b, #ff416c);
            padding: 18px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            height: 45px;
            width: auto;
        }

        .dashboard-title {
            font-size: 32px;
            font-weight: 600;
            color: white;
            line-height: 1;
        }

        .logout-btn {
            background: white;
            color: #ff416c;
            border: none;
            padding: 10px 25px;
            border-radius: 30px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: #ffe5ec;
        }

        /* ================= MAIN CONTENT ================= */
        .container {
            width: 75%;
            margin: 50px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.08);
            margin-bottom: 40px;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 15px;
            color: #444;
            font-weight: 600;
        }

        input[type="file"],
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #ff416c;
            box-shadow: 0 0 0 2px rgba(255,65,108,0.2);
        }

        button.primary {
            margin-top: 20px;
            padding: 12px 35px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(to right, #ff4b2b, #ff416c);
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
        }

        button.primary:hover {
            opacity: 0.9;
            transform: scale(1.03);
        }

        .result-box {
            margin-top: 20px;
            padding: 20px;
            background: #f9fafc;
            border-radius: 10px;
            border: 1px solid #eee;
            min-height: 60px;
            font-size: 14px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<!-- ================= HEADER ================= -->
<div class="header">
    <div class="header-left">
        <img src="{{ url_for('static', filename='logo.png') }}" class="logo-img">
        <span class="dashboard-title">Dashboard</span>
    </div>

    <form action="/logout" method="GET">
        <button class="logout-btn">Logout</button>
    </form>
</div>

<!-- ================= MAIN CONTENT ================= -->
<div class="container">

    <!-- Upload Section -->
    <div class="card">
        <div class="section-title">📄 Upload Document</div>

        <input type="file" id="fileInput">
        <button class="primary" onclick="uploadFile()">Upload Document</button>

        <div class="result-box" id="uploadResult">
            Upload a PDF document to begin.
        </div>
    </div>

    <!-- Ask Section -->
    <div class="card">
        <div class="section-title">💬 Ask Question From Document</div>

        <input type="text" id="questionInput" placeholder="Ask something about your uploaded document...">
        <button class="primary" onclick="askQuestion()">Ask AI</button>

        <div class="result-box" id="answerBox">
            AI response will appear here.
        </div>
    </div>

</div>

<script>

async function uploadFile() {
    const fileInput = document.getElementById("fileInput");
    const resultBox = document.getElementById("uploadResult");

    if (!fileInput.files.length) {
        resultBox.innerText = "Please select a file.";
        return;
    }

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);

    resultBox.innerText = "Uploading and extracting text...";

    try {
        const response = await fetch("/upload", {
            method: "POST",
            body: formData
        });

        const data = await response.json();
        resultBox.innerText = data.message;

    } catch (error) {
        resultBox.innerText = "Upload failed.";
    }
}

async function askQuestion() {
    const question = document.getElementById("questionInput").value;
    const answerBox = document.getElementById("answerBox");

    if (!question) {
        answerBox.innerText = "Please enter a question.";
        return;
    }

    answerBox.innerText = "Processing with Gemini AI...";

    try {
        const response = await fetch("/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ question })
        });

        const data = await response.json();
        answerBox.innerText = data.answer;

    } catch (error) {
        answerBox.innerText = "AI request failed.";
    }
}

</script>

</body>
</html>
