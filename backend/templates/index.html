<!DOCTYPE html>
<html>

<head>
    <title>DocSearch AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- Logo -->
    <div class="logo">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo">
    </div>

    <div class="container" id="container">

        <!-- SIGN UP -->
        <div class="form-container sign-up-container">
            <form id="signupForm">
                <h1>Create Account</h1>

                <div class="social-icons">
                    <a href="{{ url_for('facebook_login', mode='signup') }}"><i class="fab fa-facebook-f"></i></a>
                    <a href="{{ url_for('google_login', mode='signup') }}"><i class="fab fa-google"></i></a>
                    <a href="{{ url_for('linkedin_login', mode='signup') }}"><i class="fab fa-linkedin-in"></i></a>
                </div>

                <span>or use your email for registration</span>

                <input type="text" id="signupName" placeholder="Name" required>
                <input type="email" id="signupEmail" placeholder="Email" required>
                <input type="password" id="signupPassword" placeholder="Password" required>

                <div id="signupLoader" class="loader"></div>
                <div id="signupMessage" class="message"></div>

                <button type="submit" id="signupBtn">SIGN UP</button>
            </form>
        </div>

        <!-- SIGN IN -->
        <div class="form-container sign-in-container">
            <form id="signinForm">
                <h1>Sign In</h1>

                <div class="social-icons">
                    <a href="{{ url_for('facebook_login', mode='signin') }}"><i class="fab fa-facebook-f"></i></a>
                    <a href="{{ url_for('google_login', mode='signin') }}">
                        <i class="fab fa-google"></i>
                    </a>
                    <a href="{{ url_for('linkedin_login', mode='signin') }}"><i class="fab fa-linkedin-in"></i></a>
                </div>

                <span>or use your account</span>

                <input type="email" id="signinEmail" placeholder="Email" required>
                <input type="password" id="signinPassword" placeholder="Password" required>

                <div id="signinLoader" class="loader"></div>
                <div id="signinMessage" class="message"></div>

                <button type="submit" id="signinBtn">SIGN IN</button>
            </form>
        </div>

        <!-- OVERLAY -->
        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Welcome Back!</h1>
                    <p>To keep connected with us please login</p>
                    <button class="ghost" id="signIn" type="button">SIGN IN</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>Hello, Friend!</h1>
                    <p>Enter your personal details and start journey with us</p>
                    <button class="ghost" id="signUp" type="button">SIGN UP</button>
                </div>
            </div>
        </div>

    </div>

    <!-- SUCCESS OVERLAY -->
    <div class="success-overlay" id="successOverlay">
        <div class="success-box">
            <i class="fas fa-check-circle"></i>
            <h2 id="successTitle">Success!</h2>
            <p id="successMessage">Directing you to your dashboard...</p>
        </div>
    </div>

    <script>

        /* ================= ANIMATION ================= */

        const container = document.getElementById('container');
        const signUpButton = document.getElementById('signUp');
        const signInButton = document.getElementById('signIn');

        signUpButton.addEventListener('click', () => {
            console.log("Switching to Sign Up panel");
            container.classList.add("right-panel-active");
        });

        signInButton.addEventListener('click', () => {
            console.log("Switching to Sign In panel");
            container.classList.remove("right-panel-active");
        });

        // Check for social login success on page load
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const isSocialSuccess = urlParams.get('social_success') === 'true';
            const mode = urlParams.get('mode') || 'signin';

            if (isSocialSuccess) {
                console.log(`Social success detected! Mode: ${mode}`);

                // If they were on the Sign Up panel, make sure we show it before the popup
                if (mode === 'signup') {
                    container.classList.add("right-panel-active");
                }

                // Remove the parameters from URL immediately
                const newUrl = window.location.origin + window.location.pathname;
                window.history.replaceState({}, document.title, newUrl);

                const successMsg = mode === 'signup' ? "Account Created! Welcome to DocSearch AI." : "Login Successful! Welcome back.";
                showSuccess(successMsg, "/dashboard");
            }
        });

        /* ================= HELPERS ================= */

        function showSuccess(message, redirectUrl = null) {
            const overlay = document.getElementById("successOverlay");
            document.getElementById("successMessage").textContent = message;
            overlay.style.display = "flex";

            if (redirectUrl) {
                // Redirect after exactly 1.5 seconds
                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 1500);
            } else {
                setTimeout(() => {
                    overlay.style.display = "none";
                }, 2500);
            }
        }

        // Show a simple processing state for Social Icons
        document.querySelectorAll('.social-icons a').forEach(link => {
            link.addEventListener('click', function (e) {
                // Don't show the success overlay yet, just indicate loading
                this.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                this.style.pointerEvents = 'none';
            });
        });

        /* ================= SIGN UP ================= */

        document.getElementById("signupForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const name = document.getElementById("signupName").value;
            const email = document.getElementById("signupEmail").value;
            const password = document.getElementById("signupPassword").value;

            const loader = document.getElementById("signupLoader");
            const message = document.getElementById("signupMessage");
            const btn = document.getElementById("signupBtn");

            // Reset and Show Loader
            message.style.display = "none";
            message.className = "message";
            loader.style.display = "block";
            btn.disabled = true;

            try {
                const response = await fetch("/signup", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                loader.style.display = "none";
                btn.disabled = false;

                if (response.ok) {
                    showSuccess("Account Created Successfully! Please Sign In.");
                    // Switch to sign in panel
                    setTimeout(() => {
                        container.classList.remove("right-panel-active");
                    }, 2000);
                } else {
                    message.textContent = data.message;
                    message.className = "message error";
                    message.style.display = "block";
                }

            } catch (error) {
                loader.style.display = "none";
                btn.disabled = false;
                message.textContent = "Server Error";
                message.className = "message error";
                message.style.display = "block";
            }
        });

        /* ================= SIGN IN ================= */

        document.getElementById("signinForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const email = document.getElementById("signinEmail").value;
            const password = document.getElementById("signinPassword").value;

            const loader = document.getElementById("signinLoader");
            const message = document.getElementById("signinMessage");
            const btn = document.getElementById("signinBtn");

            // Reset and Show Loader
            message.style.display = "none";
            message.className = "message";
            loader.style.display = "block";
            btn.disabled = true;

            try {
                const response = await fetch("/signin", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    loader.style.display = "none";
                    showSuccess("Login Successful! Welcome back.", "/dashboard");
                } else {
                    loader.style.display = "none";
                    btn.disabled = false;
                    message.textContent = data.message;
                    message.className = "message error";
                    message.style.display = "block";
                }

            } catch (error) {
                loader.style.display = "none";
                btn.disabled = false;
                message.textContent = "Server Error";
                message.className = "message error";
                message.style.display = "block";
            }
        });

    </script>

</body>

</html>
