<!DOCTYPE html>
<html>

<head>
    <title>DocSearch AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- Logo -->
    <div class="logo">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo">
    </div>

    <div class="container" id="container">

        <!-- SIGN UP -->
        <div class="form-container sign-up-container">
            <form id="signupForm">
                <h1>Create Account</h1>

                <div class="social-icons">
                    <a href="#"><i class="fab fa-facebook-f"></i></a>
                    <a href="#"><i class="fab fa-google"></i></a>
                    <a href="#"><i class="fab fa-linkedin-in"></i></a>
                </div>

                <span>or use your email for registration</span>

                <input type="text" id="signupName" placeholder="Name" required>
                <input type="email" id="signupEmail" placeholder="Email" required>
                <input type="password" id="signupPassword" placeholder="Password" required>

                <div id="signupLoader" class="loader"></div>
                <div id="signupMessage" class="message"></div>

                <button type="submit" id="signupBtn">SIGN UP</button>
            </form>
        </div>

        <!-- SIGN IN -->
        <div class="form-container sign-in-container">
            <form id="signinForm">
                <h1>Sign In</h1>

                <div class="social-icons">
                    <a href="#"><i class="fab fa-facebook-f"></i></a>
                    <a href="{{ url_for('google.login') }}">
                        <i class="fab fa-google"></i>
                    </a>

                    <a href="#"><i class="fab fa-linkedin-in"></i></a>
                </div>

                <span>or use your account</span>

                <input type="email" id="signinEmail" placeholder="Email" required>
                <input type="password" id="signinPassword" placeholder="Password" required>

                <div id="signinLoader" class="loader"></div>
                <div id="signinMessage" class="message"></div>

                <button type="submit" id="signinBtn">SIGN IN</button>
            </form>
        </div>

        <!-- OVERLAY -->
        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Welcome Back!</h1>
                    <p>To keep connected with us please login</p>
                    <button class="ghost" id="signIn">SIGN IN</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>Hello, Friend!</h1>
                    <p>Enter your personal details and start journey with us</p>
                    <button class="ghost" id="signUp">SIGN UP</button>
                </div>
            </div>
        </div>

    </div>

    <script>

        /* ================= ANIMATION ================= */

        const container = document.getElementById('container');
        const signUpButton = document.getElementById('signUp');
        const signInButton = document.getElementById('signIn');

        signUpButton.addEventListener('click', () => {
            container.classList.add("right-panel-active");
        });

        signInButton.addEventListener('click', () => {
            container.classList.remove("right-panel-active");
        });

        /* ================= SIGN UP ================= */

        document.getElementById("signupForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const name = document.getElementById("signupName").value;
            const email = document.getElementById("signupEmail").value;
            const password = document.getElementById("signupPassword").value;

            const loader = document.getElementById("signupLoader");
            const message = document.getElementById("signupMessage");
            const btn = document.getElementById("signupBtn");

            // Reset and Show Loader
            message.style.display = "none";
            message.className = "message";
            loader.style.display = "block";
            btn.disabled = true;

            try {
                const response = await fetch("/signup", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                loader.style.display = "none";
                btn.disabled = false;
                message.textContent = data.message;
                message.style.display = "block";

                if (response.ok) {
                    message.classList.add("success");
                } else {
                    message.classList.add("error");
                }

            } catch (error) {
                loader.style.display = "none";
                btn.disabled = false;
                message.textContent = "Server Error";
                message.className = "message error";
                message.style.display = "block";
            }
        });

        /* ================= SIGN IN ================= */

        document.getElementById("signinForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const email = document.getElementById("signinEmail").value;
            const password = document.getElementById("signinPassword").value;

            const loader = document.getElementById("signinLoader");
            const message = document.getElementById("signinMessage");
            const btn = document.getElementById("signinBtn");

            // Reset and Show Loader
            message.style.display = "none";
            message.className = "message";
            loader.style.display = "block";
            btn.disabled = true;

            try {
                const response = await fetch("/signin", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    loader.style.display = "none";
                    message.textContent = data.message;
                    message.className = "message success";
                    message.style.display = "block";

                    // Delay redirect to show success message
                    setTimeout(() => {
                        window.location.href = "/dashboard";
                    }, 1500);
                } else {
                    loader.style.display = "none";
                    btn.disabled = false;
                    message.textContent = data.message;
                    message.className = "message error";
                    message.style.display = "block";
                }

            } catch (error) {
                loader.style.display = "none";
                btn.disabled = false;
                message.textContent = "Server Error";
                message.className = "message error";
                message.style.display = "block";
            }
        });

    </script>

</body>

</html>
